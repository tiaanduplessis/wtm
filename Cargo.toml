[package]
name = "worktree-manager"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Recursively discover, inspect, and manage Git worktrees with a keyboard and mouse terminal UI"
license = "MIT"
readme = "README.md"
repository = "https://github.com/tiaanduplessis/wtm"
keywords = ["git", "worktree", "cli", "tui", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[[bin]]
name = "wtm"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5"
webbrowser = "1"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true
