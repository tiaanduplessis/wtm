name: Bug report
description: Report a reproducible problem using disposable repositories.
body:
  - type: markdown
    attributes:
      value: |
        Do not post credentials, proprietary code, or private paths. For vulnerabilities,
        use the reporting instructions in SECURITY.md.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: wtm version, operating system, architecture, Git version, and terminal.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use a minimal, disposable Git repository. Include the command or UI steps.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
