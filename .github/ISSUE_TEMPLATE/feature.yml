name: Feature request
description: Explain the workflow you want to improve.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: What are you trying to do, and what happens today?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Proposed behavior
      description: Include alternatives or existing commands you have tried.
    validations:
      required: true
