name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_TARGET: ${{ matrix.target }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check release tag and notes
        run: python3 scripts/release.py check --tag "$RELEASE_TAG"
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup target add "$RELEASE_TARGET"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install musl linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
      - name: Source and installer checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build native release binary
        run: cargo build --release --locked --target "$RELEASE_TARGET"
      - name: Real terminal checks
        run: |
          python3 -m pip install -r scripts/requirements.txt
          python3 scripts/tui_smoke.py "target/$RELEASE_TARGET/release/wtm"
      - name: Package verified binary and notices
        run: |
          python3 scripts/release.py package --tag "$RELEASE_TAG" --target "$RELEASE_TARGET" \
            --binary "target/$RELEASE_TARGET/release/wtm"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wtm-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  draft:
    name: Assemble draft release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wtm-*
          merge-multiple: true
          path: dist
      - name: Validate complete asset set and create checksums
        run: |
          python3 scripts/release.py checksums --tag "$RELEASE_TAG"
          python3 scripts/release.py notes --tag "$RELEASE_TAG" > dist/RELEASE_NOTES.md
      - name: Create or update draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [ "$draft" != true ]; then
              echo 'Refusing to modify a published release.' >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --notes-file dist/RELEASE_NOTES.md
            gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "wtm $RELEASE_TAG" \
              --notes-file dist/RELEASE_NOTES.md dist/*.tar.gz dist/SHA256SUMS
          fi
